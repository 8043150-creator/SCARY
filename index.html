<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at center,
            #4a451b 0%,
            #27250e 35%,
            #0c0b07 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Old fluorescent light effect */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.035) 4px
        );

    opacity: .5;
}

/* Slight darkness around edges */

body::after {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.45) 100%
        );
}

/* Main container */

.container {
    position: relative;
    z-index: 5;

    width: 92%;
    max-width: 700px;

    text-align: center;
}

/* Title */

.title {
    font-size: clamp(50px, 10vw, 105px);

    font-weight: 900;

    letter-spacing: 13px;

    color: #d8ce72;

    text-shadow:
        0 0 8px #a69c49,
        0 0 25px rgba(220,205,90,.3);

    margin-bottom: 8px;
}

.subtitle {
    color: #999;

    font-size: 13px;

    letter-spacing: 7px;

    margin-bottom: 38px;
}

/* Menu box */

.menu {
    width: 100%;

    padding: 35px;

    background:
        rgba(0,0,0,.52);

    border:
        1px solid rgba(220,205,100,.25);

    box-shadow:
        0 0 60px rgba(0,0,0,.6);

    backdrop-filter: blur(8px);
}

/* Labels */

.label {
    display: block;

    margin-bottom: 8px;

    color: #888;

    font-size: 10px;

    letter-spacing: 3px;
}

/* Inputs */

input {
    width: 100%;

    height: 52px;

    padding: 0 15px;

    margin-bottom: 13px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid #66603b;

    outline: none;

    color: white;

    text-align: center;

    font-size: 16px;

    letter-spacing: 2px;

    transition: .2s;
}

input::placeholder {
    color: #666;
}

input:focus {
    border-color: #d7ca63;

    background:
        rgba(220,205,90,.06);

    box-shadow:
        0 0 20px rgba(220,205,90,.12);
}

/* Buttons */

button {
    width: 100%;

    height: 52px;

    border:
        1px solid #a89e50;

    background:
        rgba(210,198,80,.08);

    color: #eee;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 4px;

    cursor: pointer;

    transition:
        background .2s,
        box-shadow .2s,
        transform .15s;
}

button:hover {
    background:
        rgba(210,198,80,.2);

    box-shadow:
        0 0 25px rgba(220,205,90,.15);

    transform: translateY(-1px);
}

button:active {
    transform: translateY(1px);
}

/* Join section */

.joinSection {
    margin-top: 28px;

    padding-top: 28px;

    border-top:
        1px solid rgba(255,255,255,.08);
}

/* Error */

#error {
    min-height: 22px;

    margin-top: 15px;

    color: #d94b4b;

    font-size: 13px;
}

/* Party lobby */

#partyScreen {
    display: none;
}

/* Party code */

.codeLabel {
    color: #777;

    font-size: 11px;

    letter-spacing: 3px;
}

.partyCode {
    margin: 15px 0;

    color: #e0d66d;

    font-size: 48px;

    font-weight: 900;

    letter-spacing: 12px;

    text-shadow:
        0 0 20px rgba(220,205,90,.35);
}

.shareText {
    color: #777;

    font-size: 12px;

    line-height: 1.6;

    margin-bottom: 25px;
}

/* Players */

.players {
    width: 100%;

    margin-bottom: 20px;

    text-align: left;
}

.player {
    padding: 13px 15px;

    margin-bottom: 5px;

    background:
        rgba(255,255,255,.04);

    border-left:
        2px solid transparent;

    color: #bbb;

    font-size: 14px;
}

.player.host {
    color: #e0d66d;

    border-left-color:
        #d6c957;
}

/* Waiting */

.waiting {
    margin-top: 14px;

    color: #666;

    font-size: 12px;

    letter-spacing: 1px;
}

/* Footer */

.footer {
    margin-top: 20px;

    color: #555;

    font-size: 10px;

    letter-spacing: 2px;
}

/* Mobile */

@media (max-width: 600px) {

    .menu {
        padding: 25px 20px;
    }

    .title {
        letter-spacing: 7px;
    }

    .partyCode {
        font-size: 38px;
        letter-spacing: 8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =================================================
         MAIN MENU
    ================================================== -->

    <div id="mainMenu">

        <div class="title">
            LEVEL 0
        </div>

        <div class="subtitle">
            THE BACKROOMS
        </div>


        <div class="menu">

            <label class="label">
                ENTER YOUR NAME
            </label>

            <input
                id="nameInput"
                type="text"
                maxlength="16"
                placeholder="PLAYER"
                autocomplete="off"
            >


            <button id="createButton">
                CREATE PARTY
            </button>


            <div class="joinSection">

                <label class="label">
                    HAVE A PARTY CODE?
                </label>

                <input
                    id="codeInput"
                    type="text"
                    maxlength="5"
                    placeholder="XXXXX"
                    autocomplete="off"
                >

                <button id="joinButton">
                    JOIN PARTY
                </button>

            </div>


            <div id="error"></div>

        </div>


        <div class="footer">
            YOU SHOULDN'T BE HERE
        </div>

    </div>


    <!-- =================================================
         PARTY LOBBY
    ================================================== -->

    <div id="partyScreen">

        <div class="title">
            PARTY
        </div>

        <div class="subtitle">
            LEVEL 0
        </div>


        <div class="menu">

            <div class="codeLabel">
                YOUR PARTY CODE
            </div>

            <div
                class="partyCode"
                id="partyCode"
            >
                -----
            </div>

            <div class="shareText">
                Give this code to your friends.<br>
                Up to 8 players can enter the party.
            </div>


            <div
                class="players"
                id="players"
            ></div>


            <button
                id="startGame"
                style="display:none;"
            >
                START GAME
            </button>


            <div
                class="waiting"
                id="waiting"
            >
                Waiting for the host...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   MULTIPLAYER VARIABLES
===================================================== */

let socket = null;

let myId = null;

let partyCode = null;

let isHost = false;


/* =====================================================
   CONNECT TO SERVER
===================================================== */

function connect() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";


    socket = new WebSocket(
        `${protocol}//${location.host}`
    );


    socket.onopen = function() {

        console.log(
            "Connected to Backrooms server."
        );

        /*
            The create/join button will send
            its message after connection.
        */

    };


    socket.onmessage = function(event) {

        let data;

        try {

            data =
                JSON.parse(event.data);

        } catch {

            return;
        }

        handleMessage(data);
    };


    socket.onerror = function() {

        showError(
            "Could not connect to the server."
        );
    };


    socket.onclose = function() {

        console.log(
            "Disconnected from server."
        );
    };
}


/* =====================================================
   SEND DATA
===================================================== */

function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

    } else {

        showError(
            "Connecting to server..."
        );
    }
}


/* =====================================================
   WAIT FOR CONNECTION
===================================================== */

function sendWhenConnected(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        send(data);

        return;
    }


    connect();


    const wait =
        setInterval(() => {

            if (
                socket &&
                socket.readyState === WebSocket.OPEN
            ) {

                clearInterval(wait);

                send(data);
            }

        }, 50);


    setTimeout(() => {

        clearInterval(wait);

    }, 5000);
}


/* =====================================================
   GET PLAYER NAME
===================================================== */

function getName() {

    let name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    if (!name) {

        name =
            "Player" +
            Math.floor(
                Math.random() * 999
            );
    }


    /*
        Save the name so game.html
        knows who the player is.
    */

    localStorage.setItem(
        "playerName",
        name
    );


    return name;
}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

    document.getElementById(
        "error"
    ).textContent =
        message;
}


/* =====================================================
   SHOW PARTY SCREEN
===================================================== */

function showPartyScreen() {

    document.getElementById(
        "mainMenu"
    ).style.display =
        "none";


    document.getElementById(
        "partyScreen"
    ).style.display =
        "block";
}


/* =====================================================
   UPDATE PARTY LOBBY
===================================================== */

function updateLobby(data) {

    partyCode =
        data.code;


    isHost =
        data.hostId === myId;


    document.getElementById(
        "partyCode"
    ).textContent =
        data.code;


    const players =
        document.getElementById(
            "players"
        );


    players.innerHTML = "";


    data.players.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "player";


            if (
                player.id === data.hostId
            ) {

                div.classList.add(
                    "host"
                );

                div.textContent =
                    "👑  " +
                    player.name +
                    " — HOST";

            } else {

                div.textContent =
                    "👤  " +
                    player.name;
            }


            players.appendChild(
                div
            );
        }
    );


    const startButton =
        document.getElementById(
            "startGame"
        );


    const waiting =
        document.getElementById(
            "waiting"
        );


    /*
        Host gets the START GAME button.
    */

    if (
        isHost &&
        !data.started
    ) {

        startButton.style.display =
            "block";

        waiting.textContent =
            "You are the host. Start when everyone is ready.";

    } else {

        startButton.style.display =
            "none";

        waiting.textContent =
            "Waiting for the host to start the game...";
    }
}


/* =====================================================
   SERVER MESSAGES
===================================================== */

function handleMessage(data) {

    switch (data.type) {


        /* ---------------------------------------------
           PARTY CREATED
        --------------------------------------------- */

        case "partyCreated":

            myId =
                data.playerId;

            partyCode =
                data.code;

            showPartyScreen();

            break;


        /* ---------------------------------------------
           PARTY JOINED
        --------------------------------------------- */

        case "partyJoined":

            myId =
                data.playerId;

            partyCode =
                data.code;

            showPartyScreen();

            break;


        /* ---------------------------------------------
           LOBBY UPDATE
        --------------------------------------------- */

        case "lobby":

            updateLobby(data);

            break;


        /* ---------------------------------------------
           GAME STARTED
        --------------------------------------------- */

        case "gameStarted":

            /*
                Save party information.
            */

            localStorage.setItem(
                "partyCode",
                partyCode
            );


            /*
                Go into the actual game.
            */

            window.location.href =
                "game.html?party=" +
                encodeURIComponent(
                    partyCode
                );

            break;


        /* ---------------------------------------------
           ERROR
        --------------------------------------------- */

        case "error":

            showError(
                data.message
            );

            break;
    }
}


/* =====================================================
   CREATE PARTY
===================================================== */

document.getElementById(
    "createButton"
).addEventListener(
    "click",
    function() {

        showError("");


        const name =
            getName();


        connect();


        sendWhenConnected({

            type: "createParty",

            name: name

        });

    }
);


/* =====================================================
   JOIN PARTY
===================================================== */

document.getElementById(
    "joinButton"
).addEventListener(
    "click",
    function() {

        showError("");


        const code =
            document.getElementById(
                "codeInput"
            ).value
            .trim()
            .toUpperCase();


        if (
            code.length !== 5
        ) {

            showError(
                "Party codes are 5 characters."
            );

            return;
        }


        const name =
            getName();


        connect();


        sendWhenConnected({

            type: "joinParty",

            code: code,

            name: name

        });

    }
);


/* =====================================================
   START GAME
===================================================== */

document.getElementById(
    "startGame"
).addEventListener(
    "click",
    function() {

        send({
            type: "startGame"
        });

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

document.getElementById(
    "nameInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            document.getElementById(
                "createButton"
            ).click();

        }

    }
);


document.getElementById(
    "codeInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            document.getElementById(
                "joinButton"
            ).click();

        }

    }
);


/* =====================================================
   AUTO-FILL SAVED NAME
===================================================== */

const savedName =
    localStorage.getItem(
        "playerName"
    );


if (savedName) {

    document.getElementById(
        "nameInput"
    ).value =
        savedName;
}

</script>

</body>
</html>
