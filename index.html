<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #403c17,
            #151408 75%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: .12;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(255,255,255,.08) 4px
        );
}

.container {

    width: 92%;

    max-width: 850px;

    text-align: center;

    position: relative;

    z-index: 2;
}

.title {

    font-size:
        clamp(50px, 10vw, 110px);

    letter-spacing:
        15px;

    font-weight:
        900;

    color:
        #d7ce73;

    text-shadow:
        0 0 10px #aaa04b,
        0 0 40px rgba(220,210,100,.2);

    margin-bottom: 10px;
}

.subtitle {

    color: #999;

    letter-spacing: 6px;

    font-size: 14px;

    margin-bottom: 50px;
}

.menu {

    background:
        rgba(0,0,0,.45);

    border:
        1px solid rgba(220,210,100,.25);

    padding: 35px;

    box-shadow:
        0 0 60px rgba(0,0,0,.5);

    backdrop-filter:
        blur(8px);
}

input {

    width: 100%;

    padding: 16px;

    margin-bottom: 15px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid #777044;

    color: white;

    outline: none;

    font-size: 16px;

    text-align: center;
}

input:focus {

    border-color:
        #d8cd65;

    box-shadow:
        0 0 15px
        rgba(220,205,90,.15);
}

button {

    width: 100%;

    padding: 16px;

    margin-top: 8px;

    background:
        rgba(210,198,80,.08);

    color: white;

    border:
        1px solid #bdb35d;

    cursor: pointer;

    font-size: 16px;

    letter-spacing: 3px;

    transition: .2s;
}

button:hover {

    background:
        rgba(210,198,80,.22);

    box-shadow:
        0 0 25px
        rgba(220,205,90,.15);
}

.joinSection {

    margin-top: 30px;

    padding-top: 30px;

    border-top:
        1px solid
        rgba(255,255,255,.1);
}

#partyScreen {

    display: none;
}

.partyCode {

    font-size: 45px;

    font-weight: bold;

    letter-spacing: 12px;

    color: #e1d76f;

    margin: 20px 0;

    text-shadow:
        0 0 20px
        rgba(220,210,80,.3);
}

.small {

    color: #888;

    font-size: 13px;

    line-height: 1.6;
}

.players {

    margin-top: 25px;

    text-align: left;
}

.player {

    padding: 12px;

    background:
        rgba(255,255,255,.04);

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    color: #ccc;
}

.host {

    color: #e1d76f;
}

.error {

    color: #ff5555;

    min-height: 22px;

    margin-top: 15px;
}

#startGame {

    display: none;
}

.waiting {

    margin-top: 15px;

    color: #777;

    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        LEVEL 0
    </div>

    <div class="subtitle">
        THE BACKROOMS
    </div>


    <!-- MAIN MENU -->

    <div class="menu" id="mainMenu">

        <input
            id="nameInput"
            placeholder="YOUR NAME"
            maxlength="16"
        >

        <button id="createButton">
            CREATE PARTY
        </button>


        <div class="joinSection">

            <input
                id="codeInput"
                placeholder="PARTY CODE"
                maxlength="5"
            >

            <button id="joinButton">
                JOIN PARTY
            </button>

        </div>

        <div
            class="error"
            id="error"
        ></div>

    </div>


    <!-- PARTY LOBBY -->

    <div
        class="menu"
        id="partyScreen"
    >

        <div class="small">
            YOUR PARTY CODE
        </div>

        <div
            class="partyCode"
            id="partyCode"
        >
            -----
        </div>

        <div class="small">
            Send this code to your friends.
        </div>


        <div
            class="players"
            id="players"
        ></div>


        <button id="startGame">
            START GAME
        </button>

        <div
            class="waiting"
            id="waiting"
        >
            Waiting for the host...
        </div>

    </div>

</div>


<script>

let socket;

let myId = null;

let partyCode = null;

let isHost = false;


function connect() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket = new WebSocket(
        `${protocol}//${location.host}`
    );


    socket.onopen = () => {

        console.log(
            "Connected to multiplayer server"
        );
    };


    socket.onmessage = event => {

        const data =
            JSON.parse(event.data);

        handleMessage(data);
    };


    socket.onerror = () => {

        showError(
            "Could not connect to the game server."
        );
    };


    socket.onclose = () => {

        if (
            document.getElementById(
                "partyScreen"
            ).style.display === "block"
        ) {

            showError(
                "Connection lost."
            );
        }
    };
}


function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}


function getName() {

    let name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    if (!name) {

        name =
            "Player" +
            Math.floor(
                Math.random() * 999
            );
    }

    return name;
}


function showError(message) {

    document.getElementById(
        "error"
    ).textContent =
        message;
}


function showParty() {

    document.getElementById(
        "mainMenu"
    ).style.display =
        "none";

    document.getElementById(
        "partyScreen"
    ).style.display =
        "block";
}


function updateLobby(data) {

    partyCode =
        data.code;

    isHost =
        data.hostId === myId;

    document.getElementById(
        "partyCode"
    ).textContent =
        data.code;


    const players =
        document.getElementById(
            "players"
        );

    players.innerHTML = "";


    data.players.forEach(player => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "player";

        if (
            player.id === data.hostId
        ) {

            div.classList.add(
                "host"
            );

            div.textContent =
                "👑 " +
                player.name +
                " — HOST";

        } else {

            div.textContent =
                "👤 " +
                player.name;
        }

        players.appendChild(div);
    });


    const startButton =
        document.getElementById(
            "startGame"
        );

    const waiting =
        document.getElementById(
            "waiting"
        );


    if (isHost && !data.started) {

        startButton.style.display =
            "block";

        waiting.textContent =
            "You are the host. Start when everyone is ready.";

    } else {

        startButton.style.display =
            "none";

        waiting.textContent =
            "Waiting for the host to start the game...";
    }
}


function handleMessage(data) {

    switch (data.type) {

        case "partyCreated":

            myId =
                data.playerId;

            partyCode =
                data.code;

            showParty();

            break;


        case "partyJoined":

            myId =
                data.playerId;

            partyCode =
                data.code;

            showParty();

            break;


        case "lobby":

            updateLobby(data);

            break;


        case "gameStarted":

            window.location.href =
                `game.html?party=${partyCode}`;

            break;


        case "error":

            showError(
                data.message
            );

            break;
    }
}


/*
    CREATE PARTY
*/

document.getElementById(
    "createButton"
).addEventListener(
    "click",
    () => {

        showError("");

        connect();

        setTimeout(() => {

            send({
                type: "createParty",
                name: getName()
            });

        }, 250);
    }
);


/*
    JOIN PARTY
*/

document.getElementById(
    "joinButton"
).addEventListener(
    "click",
    () => {

        showError("");

        const code =
            document.getElementById(
                "codeInput"
            ).value
            .trim()
            .toUpperCase();

        if (code.length !== 5) {

            showError(
                "Enter a 5-character party code."
            );

            return;
        }

        connect();

        setTimeout(() => {

            send({
                type: "joinParty",
                code,
                name: getName()
            });

        }, 250);
    }
);


/*
    START GAME
*/

document.getElementById(
    "startGame"
).addEventListener(
    "click",
    () => {

        send({
            type: "startGame"
        });
    }
);


/*
    Enter key works
*/

document.getElementById(
    "codeInput"
).addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter") {

            document.getElementById(
                "joinButton"
            ).click();
        }
    }
);

</script>

</body>
</html>
