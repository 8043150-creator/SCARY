<script type="module">

import * as THREE from "three";


/* =========================================================
   THE BASEMENT 3D
========================================================= */


/* =========================
   VARIABLES
========================= */

let scene;
let camera;
let renderer;

let flashlight;

let gameStarted = false;
let gameEnded = false;

let health = 100;
let stamina = 100;
let keysFound = 0;

let monster;
let monsterGroup;

let keys = [];
let walls = [];

let lastTime = performance.now();

const clock = new THREE.Clock();


/* =========================
   AUDIO
========================= */

let audioContext;

function startAudio() {

    try {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    } catch(e) {}

}

function beep(freq, duration, volume) {

    if (!audioContext) return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.frequency.value = freq;
    osc.type = "sine";

    gain.gain.value = volume;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.stop(
        audioContext.currentTime + duration
    );
}


/* =========================
   SCENE
========================= */

function createScene() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x020202);

    scene.fog =
        new THREE.FogExp2(
            0x050505,
            .025
        );


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        .1,
        1000
    );

    camera.position.set(
        0,
        1.7,
        8
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document.body.appendChild(
        renderer.domElement
    );


    /* AMBIENT */

    const ambient =
        new THREE.AmbientLight(
            0x222222,
            .35
        );

    scene.add(ambient);


    /* FLASHLIGHT */

    flashlight =
        new THREE.SpotLight(
            0xffffff,
            7,
            35,
            Math.PI / 7,
            .6,
            1
        );

    flashlight.position.set(
        0,
        1.6,
        0
    );

    flashlight.castShadow = true;

    camera.add(flashlight);

    scene.add(camera);


    createFloor();
    createCeiling();
    createWalls();
    createDecor();
    createKeys();
    createExit();
    createMonster();

}


/* =========================
   FLOOR
========================= */

function createFloor() {

    const geometry =
        new THREE.PlaneGeometry(
            100,
            100
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x161616,
            roughness: 1
        });

    const floor =
        new THREE.Mesh(
            geometry,
            material
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);
}


/* =========================
   CEILING
========================= */

function createCeiling() {

    const geometry =
        new THREE.PlaneGeometry(
            100,
            100
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x090909
        });

    const ceiling =
        new THREE.Mesh(
            geometry,
            material
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y = 4;

    scene.add(ceiling);
}


/* =========================
   WALLS
========================= */

function addWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x252525,
            roughness: .95
        });

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        y,
        z
    );

    wall.castShadow = true;
    wall.receiveShadow = true;

    scene.add(wall);

    walls.push(wall);

    return wall;
}


function createWalls() {

    /* OUTER WALLS */

    addWall(
        0,2,-50,
        100,4,1
    );

    addWall(
        0,2,50,
        100,4,1
    );

    addWall(
        -50,2,0,
        1,4,100
    );

    addWall(
        50,2,0,
        1,4,100
    );


    /* INNER MAZE */

    addWall(
        -20,2,-20,
        1,4,35
    );

    addWall(
        5,2,-20,
        1,4,35
    );

    addWall(
        25,2,-5,
        40,4,1
    );

    addWall(
        10,2,15,
        35,4,1
    );

    addWall(
        -25,2,25,
        1,4,35
    );

    addWall(
        -5,2,35,
        35,4,1
    );

    addWall(
        30,2,30,
        1,4,35
    );

    addWall(
        5,2,-38,
        30,4,1
    );

    addWall(
        -30,2,-5,
        20,4,1
    );
}


/* =========================
   DECORATIONS
========================= */

function createDecor() {

    /* pillars */

    for(let i=0;i<18;i++) {

        const x =
            -42 + Math.random()*84;

        const z =
            -42 + Math.random()*84;

        const geometry =
            new THREE.BoxGeometry(
                .7,
                4,
                .7
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x303030
            });

        const pillar =
            new THREE.Mesh(
                geometry,
                material
            );

        pillar.position.set(
            x,
            2,
            z
        );

        pillar.castShadow = true;

        scene.add(pillar);
    }


    /* ceiling lights */

    for(let i=0;i<15;i++) {

        const light =
            new THREE.PointLight(
                0x777777,
                .7,
                7
            );

        light.position.set(
            -40 + Math.random()*80,
            3.7,
            -40 + Math.random()*80
        );

        scene.add(light);

        const bulb =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .12,
                    8,
                    8
                ),
                new THREE.MeshBasicMaterial({
                    color:0xffffff
                })
            );

        bulb.position.copy(
            light.position
        );

        scene.add(bulb);
    }
}


/* =========================
   KEYS
========================= */

function createKeys() {

    const positions = [
        [-35,1.2,-30],
        [18,1.2,20],
        [35,1.2,-30]
    ];

    positions.forEach(
        (position,index) => {

            const group =
                new THREE.Group();

            /* ring */

            const ring =
                new THREE.Mesh(
                    new THREE.TorusGeometry(
                        .25,
                        .07,
                        8,
                        20
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0xffcc55,
                        emissive:0x553300,
                        emissiveIntensity:2
                    })
                );

            ring.rotation.x =
                Math.PI / 2;

            group.add(ring);


            /* handle */

            const handle =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .08,
                        .08,
                        .5
                    ),
                    ring.material
                );

            handle.position.z = .25;

            group.add(handle);


            group.position.set(
                position[0],
                position[1],
                position[2]
            );

            scene.add(group);

            keys.push({
                object:group,
                collected:false
            });
        }
    );
}


/* =========================
   EXIT
========================= */

let exitDoor;

function createExit() {

    const geometry =
        new THREE.BoxGeometry(
            4,
            4,
            .5
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x111111,
            roughness:1
        });

    exitDoor =
        new THREE.Mesh(
            geometry,
            material
        );

    exitDoor.position.set(
        43,
        2,
        42
    );

    exitDoor.castShadow = true;

    scene.add(exitDoor);


    /* EXIT SIGN */

    const sign =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                .4,
                .1
            ),
            new THREE.MeshStandardMaterial({
                color:0x440000,
                emissive:0x330000
            })
        );

    sign.position.set(
        43,
        4.2,
        41.7
    );

    scene.add(sign);
}


/* =========================
   MONSTER
========================= */

function createMonster() {

    monsterGroup =
        new THREE.Group();


    /* BODY */

    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .55,
                1.8,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x030303,
                roughness:1
            })
        );

    body.position.y = 1.4;

    body.castShadow = true;

    monsterGroup.add(body);


    /* HEAD */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .65,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color:0x050505
            })
        );

    head.position.y = 2.8;

    head.castShadow = true;

    monsterGroup.add(head);


    /* EYES */

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0xff2222
        });

    const eye1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .09,
                8,
                8
            ),
            eyeMaterial
        );

    const eye2 =
        eye1.clone();

    eye1.position.set(
        -.22,
        2.9,
        -.58
    );

    eye2.position.set(
        .22,
        2.9,
        -.58
    );

    monsterGroup.add(
        eye1,
        eye2
    );


    /* ARMS */

    for(let side of [-1,1]) {

        const arm =
            new THREE.Mesh(
                new THREE.CapsuleGeometry(
                    .18,
                    1.3,
                    6,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x050505
                })
            );

        arm.position.set(
            side*.7,
            1.5,
            0
        );

        arm.rotation.z =
            side * .3;

        monsterGroup.add(arm);
    }


    monsterGroup.position.set(
        35,
        0,
        -35
    );

    scene.add(monsterGroup);
}


/* =========================
   MOVEMENT
========================= */

const movement = {
    forward:false,
    backward:false,
    left:false,
    right:false,
    sprint:false
};

document.addEventListener(
    "keydown",
    e => {

        switch(e.key.toLowerCase()) {

            case "w":
                movement.forward=true;
                break;

            case "s":
                movement.backward=true;
                break;

            case "a":
                movement.left=true;
                break;

            case "d":
                movement.right=true;
                break;

            case "shift":
                movement.sprint=true;
                break;

            case "f":
                toggleFlashlight();
                break;
        }
    }
);


document.addEventListener(
    "keyup",
    e => {

        switch(e.key.toLowerCase()) {

            case "w":
                movement.forward=false;
                break;

            case "s":
                movement.backward=false;
                break;

            case "a":
                movement.left=false;
                break;

            case "d":
                movement.right=false;
                break;

            case "shift":
                movement.sprint=false;
                break;
        }
    }
);


/* =========================
   MOUSE LOOK
========================= */

let mouseLocked = false;

renderer?.domElement;

document.addEventListener(
    "mousemove",
    e => {

        if(!mouseLocked || !gameStarted)
            return;

        camera.rotation.y -=
            e.movementX * .0025;
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;

    }
);


/* =========================
   FLASHLIGHT
========================= */

let flashlightOn = true;

function toggleFlashlight() {

    flashlightOn =
        !flashlightOn;

    flashlight.intensity =
        flashlightOn ? 7 : 0;

    document.getElementById(
        "flashlight"
    ).textContent =
        "FLASHLIGHT: " +
        (flashlightOn ? "ON" : "OFF");

}


/* =========================
   COLLISION
========================= */

function canMove(x,z) {

    const playerBox =
        new THREE.Box3();

    playerBox.setFromCenterAndSize(
        new THREE.Vector3(
            x,
            1.7,
            z
        ),
        new THREE.Vector3(
            .6,
            2,
            .6
        )
    );

    for(const wall of walls) {

        const wallBox =
            new THREE.Box3()
                .setFromObject(wall);

        if(
            playerBox.intersectsBox(
                wallBox
            )
        ) {
            return false;
        }
    }

    return true;
}


/* =========================
   COLLECT KEYS
========================= */

function updateKeys(time) {

    keys.forEach(key => {

        if(key.collected)
            return;

        key.object.rotation.y +=
            .03;

        key.object.position.y =
            1.2 +
            Math.sin(time*.003)*.15;

        const distance =
            camera.position.distanceTo(
                key.object.position
            );

        if(distance < 1.5) {

            key.collected = true;

            scene.remove(
                key.object
            );

            keysFound++;

            document.getElementById(
                "keyCount"
            ).textContent =
                keysFound;

            beep(700,.2,.2);

            showMessage(
                "KEY FOUND"
            );

            if(keysFound === 3) {

                document.getElementById(
                    "objective"
                ).textContent =
                    "ESCAPE THROUGH THE EXIT";

                showMessage(
                    "THE EXIT IS OPEN"
                );

            }
        }
    });
}


/* =========================
   MONSTER AI
========================= */

let lastMonsterSound = 0;

function updateMonster(dt) {

    if(!monsterGroup)
        return;

    const monsterPos =
        monsterGroup.position;

    const playerPos =
        camera.position;

    const distance =
        monsterPos.distanceTo(
            playerPos
        );


    /* monster only becomes aggressive
       after first key */

    if(keysFound === 0)
        return;


    /* CHASE */

    let speed =
        keysFound === 3
        ? 3.3
        : 2.4;


    if(distance < 30) {

        monsterGroup.lookAt(
            playerPos.x,
            monsterGroup.position.y,
            playerPos.z
        );

        const direction =
            new THREE.Vector3()
                .subVectors(
                    playerPos,
                    monsterPos
                )
                .normalize();

        monsterPos.x +=
            direction.x *
            speed *
            dt;

        monsterPos.z +=
            direction.z *
            speed *
            dt;
    }


    /* DANGER */

    const danger =
        Math.max(
            0,
            1 - distance/15
        );

    document.getElementById(
        "danger"
    ).style.opacity =
        danger * .75;


    /* HEARTBEAT */

    if(
        distance < 15 &&
        performance.now() -
        lastMonsterSound > 700
    ) {

        beep(
            55,
            .15,
            .25
        );

        lastMonsterSound =
            performance.now();
    }


    /* ATTACK */

    if(distance < 1.7) {

        health -=
            30 * dt;

        if(health <= 0) {

            health = 0;

            loseGame();
        }
    }


    /* JUMPSCARE */

    if(
        distance < 6 &&
        flashlightOn
    ) {

        flashlight.intensity =
            4 + Math.random()*8;
    }
}


/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(dt) {

    const direction =
        new THREE.Vector3();

    if(movement.forward)
        direction.z -= 1;

    if(movement.backward)
        direction.z += 1;

    if(movement.left)
        direction.x -= 1;

    if(movement.right)
        direction.x += 1;


    if(direction.length() === 0) {

        stamina +=
            30 * dt;

        stamina =
            Math.min(
                stamina,
                100
            );

        return;
    }


    direction.normalize();


    let speed = 4;


    if(
        movement.sprint &&
        stamina > 0
    ) {

        speed = 7;

        stamina -=
            40 * dt;

        if(stamina < 0)
            stamina = 0;

    } else {

        stamina +=
            20 * dt;

        stamina =
            Math.min(
                stamina,
                100
            );
    }


    /* rotate movement by camera */

    direction.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        camera.rotation.y
    );


    const newX =
        camera.position.x +
        direction.x *
        speed *
        dt;

    const newZ =
        camera.position.z +
        direction.z *
        speed *
        dt;


    if(canMove(
        newX,
        camera.position.z
    )) {

        camera.position.x =
            newX;
    }


    if(canMove(
        camera.position.x,
        newZ
    )) {

        camera.position.z =
            newZ;
    }
}


/* =========================
   EXIT
========================= */

function updateExit() {

    const distance =
        camera.position.distanceTo(
            exitDoor.position
        );

    if(distance < 4) {

        if(keysFound === 3) {

            winGame();

        } else {

            showMessage(
                "THE DOOR IS LOCKED"
            );
        }
    }
}


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById(
        "healthBar"
    ).style.width =
        health + "%";

    document.getElementById(
        "staminaBar"
    ).style.width =
        stamina + "%";
}


/* =========================
   MESSAGE
========================= */

let messageTimeout;

function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent = text;

    element.style.opacity = 1;

    clearTimeout(
        messageTimeout
    );

    messageTimeout =
        setTimeout(() => {

            element.style.opacity = 0;

        }, 2200);
}


/* =========================
   GAME END
========================= */

function loseGame() {

    if(gameEnded)
        return;

    gameEnded = true;
    gameStarted = false;

    document.exitPointerLock?.();

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

    beep(
        80,
        1,
        .4
    );
}


function winGame() {

    if(gameEnded)
        return;

    gameEnded = true;
    gameStarted = false;

    document.exitPointerLock?.();

    document.getElementById(
        "winScreen"
    ).style.display =
        "flex";

    beep(
        800,
        .5,
        .25
    );
}


/* =========================
   START GAME
========================= */

document.getElementById(
    "startButton"
).onclick = () => {

    startAudio();

    createScene();

    document.getElementById(
        "startScreen"
    ).style.display =
        "none";

    document.getElementById(
        "hud"
    ).style.display =
        "block";

    gameStarted = true;

    renderer.domElement.requestPointerLock();

    showMessage(
        "FIND THE 3 KEYS"
    );

    lastTime =
        performance.now();

    animate();
};


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        if(!camera || !renderer)
            return;

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================
   GAME LOOP
========================= */

function animate(time) {

    if(!gameStarted)
        return;

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(dt);

    updateKeys(time);

    updateMonster(dt);

    updateExit();

    updateHUD();


    /* flashlight follows camera */

    flashlight.position.set(
        0,
        1.5,
        0
    );


    /* subtle camera movement */

    if(
        movement.forward ||
        movement.backward ||
        movement.left ||
        movement.right
    ) {

        camera.position.y =
            1.7 +
            Math.sin(
                time*.012
            )*.025;
    }


    renderer.render(
        scene,
        camera
    );
}

</script>
