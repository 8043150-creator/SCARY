<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE BACKROOMS — LEVEL 0</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

#hud {

    position: fixed;

    inset: 0;

    pointer-events: none;

    color: white;

    z-index: 10;

    text-shadow:
        0 2px 4px black;
}

#topLeft {

    position: absolute;

    top: 18px;

    left: 18px;

    line-height: 1.8;
}

#level {

    font-size: 24px;

    font-weight: bold;

    letter-spacing: 4px;

    color: #ddd36d;
}

#party {

    font-size: 12px;

    color: #999;

    letter-spacing: 2px;
}

#objective {

    margin-top: 8px;

    max-width: 350px;

    color: #ddd;
}

#playersOnline {

    margin-top: 8px;

    font-size: 12px;

    color: #999;
}

#crosshair {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 8px;

    height: 8px;

    transform:
        translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.7);
}

#crosshair::before {

    width: 8px;

    height: 1px;

    top: 4px;

    left: 0;
}

#crosshair::after {

    width: 1px;

    height: 8px;

    top: 0;

    left: 4px;
}

#bottomLeft {

    position: absolute;

    left: 18px;

    bottom: 18px;

    color: #bbb;

    font-size: 12px;

    line-height: 1.7;
}

#bars {

    position: absolute;

    right: 18px;

    bottom: 18px;

    width: 180px;
}

.label {

    font-size: 10px;

    margin-bottom: 4px;

    letter-spacing: 2px;
}

.bar {

    height: 9px;

    width: 100%;

    background:
        rgba(0,0,0,.7);

    border:
        1px solid
        rgba(255,255,255,.25);

    margin-bottom: 10px;
}

.fill {

    height: 100%;

    width: 100%;
}

#health {
    background: #a62b2b;
}

#stamina {
    background: #d4c947;
}

#danger {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 8;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(90,0,0,.15) 60%,
            rgba(130,0,0,.75) 100%
        );

    transition:
        opacity .1s;
}

#noise {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 7;

    opacity: .035;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.25) 0px,
            rgba(255,255,255,.25) 1px,
            transparent 1px,
            transparent 4px
        );
}

#message {

    position: fixed;

    left: 50%;

    top: 18%;

    transform:
        translateX(-50%);

    color: #ddd36d;

    font-size: 18px;

    letter-spacing: 3px;

    opacity: 0;

    transition:
        opacity .3s;

    z-index: 20;
}

#loading {

    position: fixed;

    inset: 0;

    z-index: 100;

    background: #090804;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    color: white;
}

#loadingTitle {

    color: #d8ce72;

    font-size: 45px;

    letter-spacing: 10px;

    margin-bottom: 20px;
}

#loadingText {

    color: #777;

    font-size: 13px;

    letter-spacing: 3px;
}

#win,
#lose {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    text-align: center;

    background:
        rgba(0,0,0,.94);

    color: white;
}

.big {

    font-size:
        clamp(50px, 10vw, 100px);

    font-weight: 900;

    letter-spacing: 10px;

    color: #d8ce72;

    margin-bottom: 20px;
}

#lose .big {
    color: #a52e2e;
}

.overlayText {

    color: #999;

    margin-bottom: 35px;

    line-height: 1.7;
}

button {

    padding: 15px 45px;

    background:
        rgba(220,205,90,.08);

    border:
        1px solid #aaa04f;

    color: white;

    cursor: pointer;

    letter-spacing: 3px;
}

</style>

</head>

<body>


<div id="loading">

    <div id="loadingTitle">
        LEVEL 0
    </div>

    <div id="loadingText">
        CONNECTING...
    </div>

</div>


<div id="hud">

    <div id="topLeft">

        <div id="level">
            LEVEL 0
        </div>

        <div id="party">
            PARTY: <span id="partyCode">-----</span>
        </div>

        <div>
            EXIT CARDS:
            <span id="cardCount">
                0 / 3
            </span>
        </div>

        <div id="objective">

        </div>

        <div id="playersOnline">
            PLAYERS: 1
        </div>

    </div>


    <div id="crosshair"></div>


    <div id="message"></div>


    <div id="bottomLeft">

        WASD — MOVE<br>
        SHIFT — RUN<br>
        F — FLASHLIGHT<br>
        CLICK — MOUSE LOOK<br>
        ESC — RELEASE MOUSE

    </div>


    <div id="bars">

        <div class="label">
            HEALTH
        </div>

        <div class="bar">
            <div
                class="fill"
                id="health"
            ></div>
        </div>


        <div class="label">

        </div>

        <div class="bar">
            <div
                class="fill"

            ></div>
        </div>

    </div>

</div>


<div id="danger"></div>

<div id="noise"></div>


<div id="win">

    <div class="big">
        ESCAPED
    </div>

    <div class="overlayText">
        Your party escaped Level 0.
        <br>
        But the buzzing followed you.
    </div>

    <button onclick="location.href='index.html'">
        MAIN MENU
    </button>

    <div class="big">

    </div>

    </div>

    </button>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";


/*
=========================================================
SERVER CONNECTION
=========================================================
*/

const params =
    new URLSearchParams(
        location.search
    );

const partyCode =
    params.get("party");


if (!partyCode) {

    location.href =
        "index.html";
}


let socket;

let myId = null;

let gameReady = false;

let gameEnded = false;


function connect() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket = new WebSocket(
        `${protocol}//${location.host}`
    );


    socket.onopen = () => {

        send({
            type: "joinParty",
            code: partyCode,
            name:
                localStorage.getItem(
                    "playerName"
                ) || "Player"
        });
    };


    socket.onmessage = event => {

        const data =
            JSON.parse(event.data);

        handleServerMessage(data);
    };


    socket.onerror = () => {

        document.getElementById(
            "loadingText"
        ).textContent =
            "SERVER CONNECTION FAILED";
    };


    socket.onclose = () => {

        if (!gameEnded) {

            showMessage(
                "CONNECTION LOST"
            );
        }
    };
}


function send(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}


/*
=========================================================
THREE.JS
=========================================================
*/

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x15130b
    );

scene.fog =
    new THREE.FogExp2(
        0x29250f,
        .019
    );


const camera =
    new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        .05,
        150
    );

camera.rotation.order =
    "YXZ";


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/*
=========================================================
GAME VARIABLES
=========================================================
*/

const clock =
    new THREE.Clock();

const walls = [];

const lights = [];

const cards = [];

const otherPlayers = new Map();

let health = 100;

let stamina = 100;

let yaw = 0;

let pitch = 0;

let flashlightOn = true;

let bobTime = 0;

let footsteps = 0;

let collectedCards = 0;

let cardsFromServer = [];

let monsterData = {
    x: 36,
    z: 30
};

let monster;

const keys = {};

const CELL = 4;

const GRID = 25;

const mapSize =
    CELL * GRID;

const offset =
    mapSize / 2;

const playerHeight = 1.65;

const radius = .35;


/*
=========================================================
TEXTURES
=========================================================
*/

function wallpaperTexture() {

    const c =
        document.createElement(
            "canvas"
        );

    c.width = 256;
    c.height = 256;

    const ctx =
        c.getContext("2d");

    ctx.fillStyle =
        "#d6cc70";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (
        let i = 0;
        i < 6000;
        i++
    ) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        ctx.fillStyle =
            `rgba(80,70,20,${Math.random() * .07})`;

        ctx.fillRect(
            x,
            y,
            1,
            1
        );
    }

    for (
        let x = 0;
        x < 256;
        x += 64
    ) {

        ctx.fillStyle =
            "rgba(80,70,20,.13)";

        ctx.fillRect(
            x,
            0,
            2,
            256
        );
    }

    const texture =
        new THREE.CanvasTexture(c);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        2,
        2
    );

    return texture;
}


function carpetTexture() {

    const c =
        document.createElement(
            "canvas"
        );

    c.width = 256;
    c.height = 256;

    const ctx =
        c.getContext("2d");

    ctx.fillStyle =
        "#625c30";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    for (
        let i = 0;
        i < 16000;
        i++
    ) {

        const x =
            Math.random() * 256;

        const y =
            Math.random() * 256;

        ctx.fillStyle =
            `rgba(120,115,70,${Math.random() * .2})`;

        ctx.fillRect(
            x,
            y,
            1,
            1
        );
    }

    const texture =
        new THREE.CanvasTexture(c);

    texture.wrapS =
        THREE.RepeatWrapping;

    texture.wrapT =
        THREE.RepeatWrapping;

    texture.repeat.set(
        18,
        18
    );

    return texture;
}


const wallMat =
    new THREE.MeshStandardMaterial({
        map: wallpaperTexture(),
        roughness: 1
    });


const floorMat =
    new THREE.MeshStandardMaterial({
        map: carpetTexture(),
        roughness: 1
    });


/*
=========================================================
FLOOR / CEILING
=========================================================
*/

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            110,
            110
        ),
        floorMat
    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


const ceiling =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            110,
            110
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd5d2bd
        })
    );

ceiling.rotation.x =
    Math.PI / 2;

ceiling.position.y =
    3.6;

scene.add(ceiling);


/*
=========================================================
WALLS
=========================================================
*/

function addWall(
    x,
    z,
    width,
    depth
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                3.6,
                depth
            ),
            wallMat
        );

    mesh.position.set(
        x,
        1.8,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);

    walls.push({
        minX: x - width / 2,
        maxX: x + width / 2,
        minZ: z - depth / 2,
        maxZ: z + depth / 2
    });
}


/*
    Outer walls
*/

addWall(
    0,
    -offset,
    mapSize,
    .3
);

addWall(
    0,
    offset,
    mapSize,
    .3
);

addWall(
    -offset,
    0,
    .3,
    mapSize
);

addWall(
    offset,
    0,
    .3,
    mapSize
);


/*
    Internal maze walls
*/

for (
    let x = 1;
    x < GRID;
    x++
) {

    for (
        let z = 1;
        z < GRID;
        z++
    ) {

        if (
            Math.random() < .23
        ) {

            const wx =
                x * CELL -
                offset;

            const wz =
                z * CELL -
                offset;

            if (
                Math.random() > .5
            ) {

                addWall(
                    wx + CELL / 2,
                    wz,
                    CELL,
                    .22
                );

            } else {

                addWall(
                    wx,
                    wz + CELL / 2,
                    .22,
                    CELL
                );
            }
        }
    }
}


/*
=========================================================
LIGHTS
=========================================================
*/

scene.add(
    new THREE.HemisphereLight(
        0xfff5c0,
        0x17130a,
        .35
    )
);


function addLight(x, z) {

    const fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                .08,
                .35
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffcc,
                emissiveIntensity: 2
            })
        );

    fixture.position.set(
        x,
        3.48,
        z
    );

    scene.add(fixture);


    const light =
        new THREE.PointLight(
            0xfff1b0,
            1.5,
            12
        );

    light.position.set(
        x,
        3.2,
        z
    );

    scene.add(light);

    lights.push({
        light,
        fixture,
        base: 1.5,
        flicker: 0
    });
}


for (
    let x = -44;
    x <= 44;
    x += 8
) {

    for (
        let z = -44;
        z <= 44;
        z += 8
    ) {

        if (
            Math.random() < .9
        ) {

            addLight(
                x,
                z
            );
        }
    }
}


/*
=========================================================
EXIT
=========================================================
*/

const exit =
    new THREE.Group();


const exitDoor =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.8,
            3,
            .2
        ),
        new THREE.MeshStandardMaterial({
            color: 0x161616
        })
    );

exitDoor.position.y =
    1.5;

exit.add(exitDoor);


const sign =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.7,
            .4,
            .1
        ),
        new THREE.MeshStandardMaterial({
            color: 0x330000,
            emissive: 0xff0000,
            emissiveIntensity: 2
        })
    );

sign.position.y =
    3.1;

exit.add(sign);

exit.position.set(
    44,
    0,
    44
);

scene.add(exit);


scene.add(
    new THREE.PointLight(
        0xff1111,
        1,
        7
    )
);


/*
=========================================================
CARDS
=========================================================
*/

function createCard(
    id,
    x,
    z
) {

    const group =
        new THREE.Group();


    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                .08,
                .8
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffdc35,
                emissive: 0xffc800,
                emissiveIntensity: 1.5
            })
        );

    mesh.position.y =
        1.05;

    group.add(mesh);


    const glow =
        new THREE.PointLight(
            0xffd900,
            .7,
            4
        );

    glow.position.y =
        1;

    group.add(glow);


    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    cards.push({
        id,
        group,
        collected: false
    });
}


createCard(
    0,
    -32,
    -28
);

createCard(
    1,
    28,
    -16
);

createCard(
    2,
    -20,
    32
);


/*
=========================================================
MONSTER
=========================================================
*/

function createMonster() {

    const group =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x030303
        });


    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .34,
                1.5,
                5,
                10
            ),
            material
        );

    body.position.y =
        1.4;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .4,
                16,
                16
            ),
            material
        );

    head.position.y =
        2.5;

    group.add(head);


    for (
        const x of [-.14,.14]
    ) {

        const eye =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .045,
                    8,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xff1111,
                    emissive: 0xff0000,
                    emissiveIntensity: 5
                })
            );

        eye.position.set(
            x,
            2.55,
            -.37
        );

        group.add(eye);
    }


    group.position.set(
        36,
        0,
        30
    );

    scene.add(group);

    return group;
}


monster =
    createMonster();


/*
=========================================================
FLASHLIGHT
=========================================================
*/

const flashlight =
    new THREE.SpotLight(
        0xffffee,
        12,
        28,
        Math.PI / 7,
        .45,
        1.5
    );

camera.add(
    flashlight
);


const flashlightTarget =
    new THREE.Object3D();

flashlightTarget.position.set(
    0,
    0,
    -10
);

camera.add(
    flashlightTarget
);

flashlight.target =
    flashlightTarget;

scene.add(camera);


camera.position.set(
    0,
    playerHeight,
    0
);


/*
=========================================================
OTHER PLAYERS
=========================================================
*/

function createOtherPlayer(
    player
) {

    if (
        otherPlayers.has(
            player.id
        )
    ) {

        return otherPlayers.get(
            player.id
        );
    }


    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .3,
                1.1,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color()
                        .setHSL(
                            Math.random(),
                            .6,
                            .45
                        )
            })
        );

    body.position.y =
        1.1;

    group.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .35,
                12,
                12
            ),
            body.material
        );

    head.position.y =
        2.1;

    group.add(head);


    /*
        Name tag
    */

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 38px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        player.name,
        256,
        70
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const tag =
        new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            })
        );

    tag.scale.set(
        3,
        .75,
        1
    );

    tag.position.y =
        3;

    group.add(tag);


    scene.add(group);

    otherPlayers.set(
        player.id,
        group
    );

    return group;
}


/*
=========================================================
SERVER MESSAGES
=========================================================
*/

function handleServerMessage(
    data
) {

    switch (data.type) {

        case "partyJoined":

            myId =
                data.playerId;

            document.getElementById(
                "partyCode"
            ).textContent =
                partyCode;

            break;


        case "lobby":

            document.getElementById(
                "playersOnline"
            ).textContent =
                `PLAYERS: ${data.players.length}`;

            break;


        case "gameStarted":

            break;


        case "gameState":

            cardsFromServer =
                data.cards;

            monsterData =
                data.monster;

            for (
                const card of data.cards
            ) {

                const local =
                    cards.find(
                        c =>
                            c.id === card.id
                    );

                if (
                    local &&
                    card.collected
                ) {

                    local.collected =
                        true;

                    local.group.visible =
                        false;
                }
            }


            for (
                const player
                of data.players
            ) {

                if (
                    player.id === myId
                ) {

                    camera.position.set(
                        player.x,
                        player.y,
                        player.z
                    );

                } else {

                    const other =
                        createOtherPlayer(
                            player
                        );

                    other.position.set(
                        player.x,
                        0,
                        player.z
                    );

                    other.rotation.y =
                        player.rotation;
                }
            }


            gameReady = true;

            document.getElementById(
                "loading"
            ).style.display =
                "none";

            break;


        case "playerUpdate":

            updateOtherPlayer(
                data.player
            );

            break;


        case "cardCollected":

            collectLocalCard(
                data.cardId
            );

            break;


        case "allCardsCollected":

            collectedCards = 3;

            updateObjective();

            showMessage(
                "ALL CARDS FOUND — FIND THE EXIT"
            );

            break;


        case "playerEscaped":

            showMessage(
                data.playerName +
                " FOUND THE EXIT!"
            );

            break;


        case "error":

            document.getElementById(
                "loadingText"
            ).textContent =
                data.message;

            break;
    }
}


function updateOtherPlayer(
    player
) {

    if (
        player.id === myId
    ) return;


    const other =
        createOtherPlayer(
            player
        );


    other.position.x +=
        (player.x -
        other.position.x) *
        .25;

    other.position.z +=
        (player.z -
        other.position.z) *
        .25;

    other.rotation.y =
        player.rotation;
}


/*
=========================================================
COLLECT CARDS
=========================================================
*/

function collectLocalCard(
    id
) {

    const card =
        cards.find(
            c => c.id === id
        );

    if (!card) return;

    if (card.collected) return;

    card.collected =
        true;

    card.group.visible =
        false;

    collectedCards++;

    document.getElementById(
        "cardCount"
    ).textContent =
        `${collectedCards} / 3`;

    updateObjective();
}


function updateObjective() {

    if (
        collectedCards >= 3
    ) {

        document.getElementById(
            "objective"
        ).textContent =
            "ALL CARDS FOUND. FIND THE EXIT.";

    } else {

        document.getElementById(
            "objective"
        ).textContent =
            "Find the three exit cards.";
    }
}


/*
=========================================================
COLLISION
=========================================================
*/

function collides(
    x,
    z
) {

    for (
        const wall of walls
    ) {

        if (
            x + radius > wall.minX &&
            x - radius < wall.maxX &&
            z + radius > wall.minZ &&
            z - radius < wall.maxZ
        ) {

            return true;
        }
    }

    return false;
}


/*
=========================================================
INPUT
=========================================================
*/

document.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;


        if (
            e.code === "KeyF"
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;
        }
    }
);


document.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;
    }
);


renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            gameReady &&
            !gameEnded
        ) {

            renderer.domElement
                .requestPointerLock();
        }
    }
);


document.addEventListener(
    "mousemove",
    e => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;
        }

        yaw -=
            e.movementX *
            .0022;

        pitch -=
            e.movementY *
            .0022;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -Math.PI / 2.1,
                Math.PI / 2.1
            );

        camera.rotation.y =
            yaw;

        camera.rotation.x =
            pitch;
    }
);


/*
=========================================================
PLAYER MOVEMENT
=========================================================
*/

function updatePlayer(
    delta
) {

    let forward = 0;

    let strafe = 0;


    if (keys["KeyW"])
        forward++;

    if (keys["KeyS"])
        forward--;

    if (keys["KeyD"])
        strafe++;

    if (keys["KeyA"])
        strafe--;


    const moving =
        forward !== 0 ||
        strafe !== 0;


    let running =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];


    if (stamina <= 0) {
        running = false;
    }


    const speed =
        running
        ? 7
        : 3.5;


    if (
        running &&
        moving
    ) {

        stamina -=
            30 * delta;

    } else {

        stamina +=
            20 * delta;
    }


    stamina =
        THREE.MathUtils.clamp(
            stamina,
            0,
            100
        );


    const forwardDir =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );


    const rightDir =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            Math.sin(yaw)
        );


    const move =
        new THREE.Vector3();


    move.addScaledVector(
        forwardDir,
        forward
    );

    move.addScaledVector(
        rightDir,
        strafe
    );


    if (
        move.lengthSq() > 0
    ) {

        move.normalize();


        const distance =
            speed * delta;


        const nextX =
            camera.position.x +
            move.x *
            distance;

        const nextZ =
            camera.position.z +
            move.z *
            distance;


        if (
            !collides(
                nextX,
                camera.position.z
            )
        ) {

            camera.position.x =
                nextX;
        }


        if (
            !collides(
                camera.position.x,
                nextZ
            )
        ) {

            camera.position.z =
                nextZ;
        }


        /*
            Head bob
        */

        bobTime +=
            delta *
            (running ? 14 : 9);

        camera.position.y =
            playerHeight +
            Math.sin(bobTime) *
            (running ? .055 : .025);


        /*
            Footsteps
        */

        footsteps -= delta;

        if (
            footsteps <= 0
        ) {

            footsteps =
                running
                ? .28
                : .48;
        }

    } else {

        camera.position.y +=
            (
                playerHeight -
                camera.position.y
            ) *
            delta *
            8;
    }


    /*
        Send position to server
    */

    send({
        type: "playerUpdate",

        x: camera.position.x,

        y: camera.position.y,

        z: camera.position.z,

        rotation: yaw
    });
}


/*
=========================================================
CARD CHECK
=========================================================
*/

function checkCards() {

    for (
        const card of cards
    ) {

        if (
            card.collected
        ) continue;


        card.group.rotation.y +=
            .02;


        card.group.position.y =
            Math.sin(
                performance.now() *
                .003
            ) * .08;


        const distance =
            camera.position.distanceTo(
                card.group.position
            );


        if (
            distance < 1.4
        ) {

            send({
                type: "collectCard",
                cardId: card.id
            });
        }
    }
}


/*
=========================================================
MONSTER
=========================================================
*/

function updateMonster(
    delta
) {

    const dx =
        camera.position.x -
        monster.position.x;

    const dz =
        camera.position.z -
        monster.position.z;


    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    /*
        The monster is
        synchronized by using
        a shared approximate
        target.
    */

    if (
        collectedCards > 0
    ) {

        const angle =
            Math.atan2(
                dx,
                dz
            );


        let speed =
            .55;

        if (
            distance < 25
        ) {

            speed =
                1.5;
        }

        if (
            distance < 12
        ) {

            speed =
                2.1;
        }


        monster.position.x +=
            Math.sin(angle) *
            speed *
            delta;

        monster.position.z +=
            Math.cos(angle) *
            speed *
            delta;


        monster.rotation.y =
            angle;
    }


    /*
        Danger
    */

    if (
        distance < 14
    ) {

        const danger =
            THREE.MathUtils.clamp(
                1 -
                distance / 14,
                0,
                1
            );

        document.getElementById(
            "danger"
        ).style.opacity =
            danger * .9;

    } else {

        document.getElementById(
            "danger"
        ).style.opacity =
            0;
    }


    if (
        distance < 1.1
    ) {

        health -=
            40 * delta;

        if (
            health <= 0
        ) {

            lose();
        }
    }
}


/*
=========================================================
EXIT
=========================================================
*/

function checkExit() {

    if (
        collectedCards < 3
    ) return;


    const distance =
        camera.position.distanceTo(
            exit.position
        );


    if (
        distance < 3
    ) {

        send({
            type: "playerEscaped"
        });

        win();
    }
}


/*
=========================================================
LIGHT FLICKER
=========================================================
*/

function updateLights() {

    for (
        const item of lights
    ) {

        if (
            Math.random() < .006
        ) {

            item.flicker =
                .15 +
                Math.random() *
                .5;
        }


        if (
            item.flicker > 0
        ) {

            item.flicker -=
                .04;

            item.light.intensity =
                Math.random() < .5
                ? 0
                : item.base;

        } else {

            item.light.intensity =
                item.base;
        }
    }
}


/*
=========================================================
MESSAGE
=========================================================
*/

let messageTimer = 0;

function showMessage(
    text
) {

    const el =
        document.getElementById(
            "message"
        );

    el.textContent =
        text;

    el.style.opacity =
        1;

    messageTimer = 3;
}


function updateMessage(
    delta
) {

    if (
        messageTimer > 0
    ) {

        messageTimer -=
            delta;

        if (
            messageTimer <= 0
        ) {

            document.getElementById(
                "message"
            ).style.opacity =
                0;
        }
    }
}


/*
=========================================================
WIN / LOSE
=========================================================
*/

function win() {

    if (gameEnded)
        return;

    gameEnded = true;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.getElementById(
        "win"
    ).style.display =
        "flex";
}


function lose() {

    if (gameEnded)
        return;

    gameEnded = true;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }

    document.getElementById(
        "lose"
    ).style.display =
        "flex";
}


/*
=========================================================
HUD
=========================================================
*/

function updateHUD() {

    document.getElementById(
        "health"
    ).style.width =
        `${Math.max(0, health)}%`;


    document.getElementById(
        "stamina"
    ).style.width =
        `${stamina}%`;


    document.getElementById(
        "cardCount"
    ).textContent =
        `${collectedCards} / 3`;
}


/*
=========================================================
RESIZE
=========================================================
*/

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/*
=========================================================
MAIN LOOP
=========================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        gameReady &&
        !gameEnded
    ) {

        updatePlayer(
            delta
        );

        checkCards();

        updateMonster(
            delta
        );

        updateLights();

        checkExit();

        updateMessage(
            delta
        );

        updateHUD();
    }


    renderer.render(
        scene,
        camera
    );
}


connect();

animate();

</script>

</html>
